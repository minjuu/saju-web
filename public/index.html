<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주토끼</title>
<meta name="description" content="생년월일시로 보는 사주 풀이">
<link rel="icon" href="/rabbit.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="#/"><img src="/rabbit.png" alt="">사주토끼</a>
    <nav id="authNav"><a class="pill" href="#/login">로그인</a></nav>
  </div>
</header>

<main>
  <!-- 홈 -->
  <section id="view-home" class="view">
    <div class="hero">
      <div class="hero-text">
        <div class="slides-wrap"><div class="slides" id="slides"></div></div>
        <div class="hero-ctrl">
          <button id="prev" aria-label="이전">←</button>
          <span id="counter">01 / 02</span>
          <button id="next" aria-label="다음">→</button>
        </div>
      </div>
      <img class="hero-rabbit" src="/rabbit.png" alt="">
    </div>

    <div class="section-head"><h2>무엇이 궁금한가요</h2><span>생년월일시만 입력하면 알 수 있어요!</span></div>
    <div class="cards" id="cards"></div>

    <div class="section-head"><h2>타로</h2><span>카드를 직접 골라 뽑아보세요</span></div>
    <div class="cards" id="tarotCards"></div>

    <div class="notice hidden">
      <b>이용 안내</b>
      <p>사주팔자 표는 누구나 볼 수 있습니다. 사주 풀이는 로그인 후 계정당 하루 한 번 볼 수 있습니다.</p>
    </div>
  </section>

  <!-- 풀이 -->
  <section id="view-reading" class="view hidden">
    <a class="back" href="#/">← 홈</a>
    <div class="reading-head">
      <span class="topic-mark" id="topicMark"></span>
      <div>
        <h1 id="topicTitle"></h1>
        <p id="topicDesc"></p>
      </div>
    </div>

    <form class="card" id="form">
      <h2>정보 입력</h2>
      <div class="grid">
        <div><label>달력</label>
          <div class="seg">
            <label><input type="radio" name="calendar" value="solar" checked>양력</label>
            <label><input type="radio" name="calendar" value="lunar">음력</label>
          </div>
          <label class="check hidden" id="leapWrap"><input type="checkbox" name="leapMonth">윤달</label>
        </div>
        <div><label>성별</label>
          <div class="seg">
            <label><input type="radio" name="gender" value="female" checked>여성</label>
            <label><input type="radio" name="gender" value="male">남성</label>
          </div>
        </div>
        <div><label for="date">생년월일</label><input type="date" id="date" required min="1900-01-01" max="2100-12-31" value="1995-01-01"></div>
        <div><label for="time">태어난 시간</label><input type="time" id="time" value="12:00">
          <label class="check"><input type="checkbox" name="timeUnknown">시간 모름</label>
        </div>
      </div>
      <div class="field"><label for="question">궁금한 점 (선택)</label>
        <textarea id="question" rows="2" maxlength="300" placeholder="예) 올해 이직해도 괜찮을까요?"></textarea>
      </div>
      <button class="primary" id="submit">사주 보기</button>
      <p class="hint" id="quotaHint"></p>
      <div class="error" id="error" role="alert"></div>
    </form>

    <section class="card hidden" id="chart"><h2>사주팔자</h2><div id="chartBody"></div></section>
    <section class="card hidden" id="loginCta">
      <p>사주 풀이는 로그인 후 계정당 하루 한 번 볼 수 있습니다.</p>
      <a class="primary" href="#/login">로그인하고 풀이 보기</a>
    </section>
    <section class="card hidden" id="readingCard"><h2>풀이</h2><div id="reading" aria-live="polite"></div></section>
  </section>

  <!-- 타로 -->
  <section id="view-tarot" class="view hidden">
    <a class="back" href="#/">← 홈</a>
    <div class="reading-head">
      <span class="topic-mark t-mark" id="tarotMark"></span>
      <div><h1 id="tarotTitle"></h1><p id="tarotDesc"></p></div>
    </div>

    <div class="card tarot-box">
      <div class="field" id="tarotQWrap"><label for="tarotQ">질문</label>
        <textarea id="tarotQ" rows="2" maxlength="300"></textarea>
      </div>
      <div class="slots" id="slots"></div>
      <p class="tarot-guide" id="tarotGuide"></p>
      <div class="deck" id="deck"></div>
      <div class="tarot-actions">
        <button class="ghost-btn" id="reshuffle" type="button">다시 섞기</button>
        <button class="primary" id="tarotGo" type="button" disabled>풀이 보기</button>
      </div>
      <div class="error" id="tarotError" role="alert"></div>
    </div>
    <section class="card hidden" id="tarotResultCard"><h2>풀이</h2><div id="tarotResult" aria-live="polite"></div></section>
  </section>

  <!-- 로그인 -->
  <section id="view-login" class="view hidden">
    <div class="login">
      <img src="/rabbit.png" alt="" class="login-logo">
      <h1>로그인</h1>
      <p class="muted">로그인하면 상세 풀이를 하루 한 번 볼 수 있습니다.</p>

      <div id="oauthButtons" class="login-buttons"></div>
      <div class="divider" id="emailDivider"><span>또는</span></div>

      <button class="sns email" id="emailToggle" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        이메일로 로그인
      </button>
      <form id="emailForm" class="email-form hidden">
        <input type="email" id="email" placeholder="이메일" autocomplete="email" required>
        <input type="password" id="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
        <button class="primary" id="emailSubmit">로그인</button>
        <button type="button" class="link" id="modeToggle">계정이 없나요? 회원가입</button>
      </form>
      <div class="error" id="loginError" role="alert"></div>
      <p class="info" id="loginInfo"></p>
      <p class="muted small" id="loginFoot">처음이면 자동으로 가입됩니다</p>
    </div>
  </section>
</main>

<footer>사주 풀이는 참고용입니다. · 사주토끼</footer>

<script src="/app.js"></script>
<script src="/tarot.js"></script>
</body>
</html>
