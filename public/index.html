<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주토끼</title>
<meta name="description" content="생년월일시로 사주팔자를 계산하고 AI가 해석합니다.">
<link rel="icon" href="/rabbit.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="hero">
    <img src="/rabbit.png" alt="">
    <div>
      <h1>사주토끼</h1>
      <p>생년월일과 태어난 시간으로 사주팔자를 계산하고, AI가 해석합니다.</p>
    </div>
  </header>
  <form class="card" id="form"><h2>정보 입력</h2>
    <div class="grid">
      <div><label>달력</label>
        <div class="seg">
          <label><input type="radio" name="calendar" value="solar" checked>양력</label>
          <label><input type="radio" name="calendar" value="lunar">음력</label>
        </div>
        <label class="check hidden" id="leapWrap"><input type="checkbox" name="leapMonth">윤달</label>
      </div>
      <div><label>성별</label>
        <div class="seg">
          <label><input type="radio" name="gender" value="female" checked>여성</label>
          <label><input type="radio" name="gender" value="male">남성</label>
        </div>
      </div>
      <div><label for="date">생년월일</label><input type="date" id="date" required min="1900-01-01" max="2100-12-31" value="1995-01-01"></div>
      <div><label for="time">태어난 시간</label><input type="time" id="time" value="12:00">
        <label class="check"><input type="checkbox" name="timeUnknown">시간 모름</label>
      </div>
    </div>
    <div style="margin-top:14px"><label for="question">궁금한 점 (선택)</label>
      <textarea id="question" rows="2" maxlength="300" placeholder="예) 올해 이직해도 괜찮을까요?"></textarea>
    </div>
    <button class="primary" id="submit">사주 보기</button>
    <div class="error" id="error" role="alert"></div>
  </form>

  <section class="card hidden" id="chart"><h2>사주팔자</h2><div id="chartBody"></div></section>
  <section class="card hidden" id="readingCard"><h2>해석</h2><div id="reading" aria-live="polite"></div></section>
  <footer>사주 해석은 참고용입니다.</footer>
</main>

<script>
const $ = s => document.querySelector(s);
document.querySelectorAll('input[name=calendar]').forEach(el => el.onchange = () =>
  $('#leapWrap').classList.toggle('hidden', $('input[name=calendar]:checked').value !== 'lunar'));
document.querySelector('input[name=timeUnknown]').onchange = e => $('#time').disabled = e.target.checked;

function payload() {
  const [year, month, day] = $('#date').value.split('-').map(Number);
  const [hour, minute] = ($('#time').value || '12:00').split(':').map(Number);
  return {
    calendar: $('input[name=calendar]:checked').value,
    leapMonth: document.querySelector('input[name=leapMonth]').checked,
    gender: $('input[name=gender]:checked').value,
    year, month, day, hour, minute,
    timeUnknown: document.querySelector('input[name=timeUnknown]').checked,
    question: $('#question').value.trim(),
  };
}

function renderChart(s) {
  const cell = (p, part) => p
    ? `<div class="char e-${p[part].element}">${p[part].hanja}<span>${p[part].korean} · ${p[part].element}</span></div><div class="god">${p[part].tenGod}</div>`
    : `<div class="char empty">?<span>모름</span></div><div class="god">&nbsp;</div>`;
  const cols = [['time', '시주'], ['day', '일주'], ['month', '월주'], ['year', '연주']];
  const max = Math.max(...Object.values(s.elements), 1);
  const color = { 목: 'var(--wood)', 화: 'var(--fire)', 토: 'var(--earth)', 금: 'var(--metal)', 수: 'var(--water)' };
  $('#chartBody').innerHTML = `
    <div class="meta">양력 ${s.solarDate} · 음력 ${s.lunarDate} · 일간 <b>${s.dayMaster}</b></div>
    <div class="pillars">${cols.map(([k, name]) => `<div class="pillar"><div class="head">${name}</div>
      ${cell(s.pillars[k], 'stem')}${cell(s.pillars[k], 'branch')}</div>`).join('')}</div>
    <div class="bars">${Object.entries(s.elements).map(([e, n]) =>
      `<div class="bar"><div style="background:${color[e]};opacity:${0.25 + 0.75 * n / max}"></div>${e} ${n}</div>`).join('')}</div>
    <div class="daeun">${s.daeun.map(d => `<div><b>${d.hanja}</b>${d.ganZhi}<br>${d.startAge}세</div>`).join('')}</div>`;
  $('#chart').classList.remove('hidden');
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  $('#error').textContent = '';
  const body = payload();
  const btn = $('#submit');
  btn.disabled = true;
  btn.textContent = '계산 중…';
  try {
    const r = await fetch('/api/saju', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const s = await r.json();
    if (!r.ok) throw new Error(s.error);
    renderChart(s);
    const out = $('#reading');
    out.innerHTML = ''; out.classList.add('loading');
    $('#readingCard').classList.remove('hidden');
    const res = await fetch('/api/reading', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) { out.classList.remove('loading'); $('#readingCard').classList.add('hidden'); throw new Error((await res.json()).error); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let text = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      text += dec.decode(value, { stream: true });
      out.classList.remove('loading');
      out.innerHTML = DOMPurify.sanitize(marked.parse(text));
    }
  } catch (err) {
    $('#error').textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '사주 보기';
    $('#reading').classList.remove('loading');
  }
};

</script>
</body>
</html>
